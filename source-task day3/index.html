<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Findings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(17, 24, 39, 0.78);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #3b82f6;
      --critical: #ef4444;
      --high: #e74c3c;
      --medium: #f39c12;
      --low: #6b7280;
      --info: #95a5a6;
      --header-blue: #1F4E78;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', Arial, sans-serif;
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(31, 78, 120, 0.3) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(231, 76, 60, 0.18) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1050px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px 28px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .shield-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #1F4E78, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.35);
    }

    .shield-icon svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: white;
      stroke-width: 2;
    }

    h2 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin: 0;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      color: #34d399;
      letter-spacing: 0.3px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      }
      70% {
        transform: scale(1);
        box-shadow: 0 0 0 8px rgba(16, 185, 129, 0);
      }
      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
      }
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .stat-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.18);
    }

    .stat-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .stat-value {
      font-size: 26px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
    }

    .stat-total { color: #60a5fa; }
    .stat-high { color: #f87171; }
    .stat-medium { color: #fbbf24; }
    .stat-info { color: #9ca3af; }

    .table-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    .table-header-info {
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.02);
      font-size: 13px;
      color: var(--text-muted);
    }

    #t {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      border: none;
    }

    #t tr {
      transition: background-color 0.15s ease;
    }

    #t tr:not(:first-child):hover {
      background-color: rgba(255, 255, 255, 0.04);
    }

    #t th {
      background-color: #1F4E78 !important;
      color: #ffffff !important;
      text-align: left;
      padding: 14px 20px;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      border: none !important;
    }

    #t th:first-child { width: 110px; }
    #t th:last-child { width: 130px; text-align: center; }

    #t td {
      padding: 14px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      border-left: none !important;
      border-right: none !important;
      border-top: none !important;
      color: #e5e7eb;
      vertical-align: middle;
    }

    #t td:first-child {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #93c5fd;
      font-weight: 500;
      white-space: nowrap;
    }

    #t td:nth-child(2) {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      line-height: 1.5;
      word-break: break-all;
    }

    #t td:last-child {
      text-align: center;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      border-radius: 6px;
      padding: 8px 14px;
    }

    .footer {
      text-align: center;
      font-size: 12px;
      color: #64748b;
      margin-top: 8px;
    }
  </style>
</head>
<body style="font-family:Arial">
  <div class="container">
    <header>
      <div class="brand-section">
        <div class="shield-icon">
          <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <div>
          <h2>Live Findings</h2>
          <div class="subtitle">Real-time Secret & Vulnerability Detection Monitor</div>
        </div>
      </div>
      <div class="status-badge">
        <div class="pulse-dot"></div>
        <span>LIVE POLLING (3s)</span>
      </div>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Total Detections</span>
        <span class="stat-value stat-total" id="stat-total">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">High / Critical</span>
        <span class="stat-value stat-high" id="stat-high">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Medium</span>
        <span class="stat-value stat-medium" id="stat-medium">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Info / Low</span>
        <span class="stat-value stat-info" id="stat-info">0</span>
      </div>
    </div>

    <div class="table-card">
      <div class="table-header-info">
        <span>Incoming Telemetry Stream</span>
        <span id="last-updated">Updating...</span>
      </div>
      <table id="t" border="1" cellpadding="6" style="border-collapse:collapse"></table>
    </div>

    <div class="footer">
      Live Detector Interface &bull; Day 3 Frontend Milestone &bull; Auto-refreshes every 3 seconds via <code>findings.json</code>
    </div>
  </div>

  <script>
    async function load() {
      try {
        const res = await fetch('findings.json?t=' + Date.now());
        if (!res.ok) return;
        const rows = await res.json();
        
        let total = rows.length;
        let highCount = 0;
        let medCount = 0;
        let infoCount = 0;

        rows.forEach(r => {
          const s = (r.severity || '').toUpperCase();
          if (s === 'HIGH' || s === 'CRITICAL') highCount++;
          else if (s === 'MEDIUM') medCount++;
          else infoCount++;
        });

        const elTotal = document.getElementById('stat-total');
        const elHigh = document.getElementById('stat-high');
        const elMed = document.getElementById('stat-medium');
        const elInfo = document.getElementById('stat-info');
        const elUpdated = document.getElementById('last-updated');

        if (elTotal) elTotal.innerText = total;
        if (elHigh) elHigh.innerText = highCount;
        if (elMed) elMed.innerText = medCount;
        if (elInfo) elInfo.innerText = infoCount;
        if (elUpdated) elUpdated.innerText = 'Last polled: ' + new Date().toLocaleTimeString();

        const t = document.getElementById('t');
        if (rows.length === 0) {
          t.innerHTML = '<tr style="background:#1F4E78;color:white"><th>Time</th><th>Finding</th><th>Severity</th></tr><tr><td colspan="3" style="text-align:center;padding:24px;color:#9ca3af;">No findings recorded yet. Waiting for scanner triggers...</td></tr>';
          return;
        }

        t.innerHTML = '<tr style="background:#1F4E78;color:white"><th>Time</th><th>Finding</th><th>Severity</th></tr>' +
          rows.slice().reverse().map(r => {
            const s = (r.severity || '').toUpperCase();
            const bg = (s === 'CRITICAL' || s === 'HIGH') ? '#e74c3c' : (s === 'MEDIUM' ? '#f39c12' : '#95a5a6');
            return `<tr><td>${r.time}</td><td>${r.summary}</td><td style="background:${bg};color:white">${r.severity}</td></tr>`;
          }).join('');
      } catch (err) {
        console.warn('Polling error:', err);
      }
    }
    load();
    setInterval(load, 3000);
  </script>
</body>
</html>
